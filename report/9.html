<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>mousemove로 자유롭게 그리기</title>
    <style>
        body {
            font-family: sans-serif;
        }
        canvas {
            border: 1px solid #ccc;
            background-color: aliceblue;
            cursor: crosshair;
        }
        .controls {
            margin-bottom: 10px;
        }
        input[type="number"] {
            width: 50px;
        }
    </style>
</head>
<body>
    <h3>mousemove로 자유롭게 그리세요</h3>
    <hr>

    <!-- 상단 컨트롤 영역 -->
    <div class="controls">
        선굵기 : <input type="number" id="lineWidth" value="5" min="1" max="30">
        선 색 : <input type="color" id="strokeColor" value="#556B2F">
    </div>

    <!-- 캔버스 영역 -->
    <canvas id="myCanvas" width="500" height="350"></canvas>

    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        let lastX = 0;
        let lastY = 0;
        let inCanvas = false; // 마우스가 캔버스 내부 영역에 있는지 여부

        // 1. 마우스가 캔버스 안으로 들어왔을 때 초기 위치 설정
        canvas.onmouseover = function (e) {
            inCanvas = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        };

        // 2. 마우스가 캔버스 안에서 움직일 때 (클릭 여부와 상관없이 계속 그림)
        canvas.onmousemove = function (e) {
            if (!inCanvas) return;

            let curX = e.offsetX;
            let curY = e.offsetY;

            let lineWidth = document.getElementById("lineWidth").value;
            let strokeColor = document.getElementById("strokeColor").value;

            context.beginPath();
            context.moveTo(lastX, lastY);
            context.lineTo(curX, curY);

            context.lineWidth = lineWidth;
            context.strokeStyle = strokeColor;
            context.lineCap = "round";
            context.stroke();

            // 이전 위치 갱신
            lastX = curX;
            lastY = curY;
        };

        // 3. 마우스가 캔버스 밖으로 나갔을 때 연속 그리기 중단
        canvas.onmouseout = function () {
            inCanvas = false;
        };
    </script>
</body>
</html>
