<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사진과 이름 출력</title>
</head>
<body>
    <h3>사진과 이름 출력</h3>
    <hr>
    <canvas id="myCanvas" width="300" height="300" style="background-color: aliceblue;"></canvas>

    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        // Image 객체 생성 및 이미지 로드
        let img = new Image();
        img.src = "spongebob.jpg"; // 사용할 이미지 경로

        img.onload = function() {
            // 1. 사진 그리기 (x=80, y=30 위치에 140x140 크기로 출력)
            context.drawImage(img, 80, 30, 140, 140);

            // 2. 텍스트 설정 및 이름 출력
            context.font = "italic bold 45px Comic Sans MS, Arial";
            context.fillStyle = "purple"; // 글자 색상
            context.strokeStyle = "lavender"; // 글자 테두리 색상
            context.lineWidth = 2;

            // 텍스트 그리기 (x=30, y=210 위치)
            context.fillText("Spongebob", 30, 210);
            context.strokeText("Spongebob", 30, 210);
        };
    </script>
</body>
</html>
