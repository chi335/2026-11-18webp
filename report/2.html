<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>drawPolygon() 만들기</title>
    <script>
        function drawPolygon(ctx, xArray, yArray) {
            ctx.beginPath(); // 경로 시작
            ctx.moveTo(xArray[0], yArray[0]); // 첫 번째 점으로 이동
            
            // 두 번째 점부터 끝까지 선 잇기
            for (let i = 1; i < xArray.length; i++) {
                ctx.lineTo(xArray[i], yArray[i]);
            }
            
            ctx.closePath(); // 시작 점과 마지막 점을 연결하여 다각형 닫기
            ctx.stroke(); // 외곽선 그리기
        }
    </script>
</head>
<body>
    <h3>drawPolygon() 만들기</h3>
    <hr>
    <canvas id="myCanvas" width="220" height="220" style="background-color:aliceblue"></canvas>
    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");
        
        let xs = [100, 10, 150, 210];
        let ys = [10, 100, 200, 60];
        
        drawPolygon(context, xs, ys);
    </script>
</body>
</html>
