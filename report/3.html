<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오륜기 그리기</title>
</head>
<body>
    <h3>오륜기 그리기</h3>
    <hr>
    <canvas id="myCanvas" width="400" height="250" style="background-color: aliceblue;"></canvas>

    <script>
        let canvas = document.getElementById("myCanvas");
        let context = canvas.getContext("2d");

        // 고리 그리기 함수
        function drawRing(x, y, color) {
            context.beginPath();
            context.arc(x, y, 40, 0, 2 * Math.PI); // 반지름 40인 원
            context.lineWidth = 6; // 선 두께 6
            context.strokeStyle = color; // 선 색상
            context.stroke();
        }

        // 위쪽 3개 고리 (파랑, 검정, 빨강)
        drawRing(100, 100, "blue");
        drawRing(190, 100, "black");
        drawRing(280, 100, "red");

        // 아래쪽 2개 고리 (노랑, 초록)
        drawRing(145, 140, "yellow");
        drawRing(235, 140, "green");
    </script>
</body>
</html>
