<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>(20, 20)에 100x200 크기로 그리기</title>
</head>
<body>
<h3>(20, 20)에 100x200 크기로 그리기</h3>
<hr>
<canvas id="myCanvas" style="background-color: aliceblue;" width="300" height="250"></canvas>
<script>
let canvas = document.getElementById("myCanvas");
let context = canvas.getContext("2d");

let img = new Image(); // 이미지 객체 생성
img.onload = function () {
    // 이미지가 성공적으로 로드된 후 캔버스에 (20, 20) 위치에 100x200 크기로 그리기
    context.drawImage(img, 20, 20, 100, 200);
}
img.src = "media/lion.png"; // 이미지 경로 설정 (실제 경로에 이미지가 있어야 합니다)
</script>
</body>
</html>
