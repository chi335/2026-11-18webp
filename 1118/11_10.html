<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>캔버스에 꽉 차게 이미지 그리기</title>
</head>
<body>
<h3>캔버스에 꽉 차게 이미지 그리기</h3>
<hr>
<!-- width 속성의 따옴표를 올바른 반각 따옴표로 수정 -->
<canvas id="myCanvas" style="background-color: aliceblue;" width="500" height="300"></canvas>
<script>
let canvas = document.getElementById("myCanvas");
let context = canvas.getContext("2d");

let img = new Image();
img.onload = function () {
    // 캔버스의 전체 너비와 높이(canvas.width, canvas.height)에 딱 맞춰 이미지 그리기
    context.drawImage(img, 0, 0, canvas.width, canvas.height);
}
img.src = "media/lion.png"; // 실제 이미지 파일 경로 확인 필요
</script>
</body>
</html>
